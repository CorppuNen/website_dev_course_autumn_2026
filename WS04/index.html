                .flex-container {display: flex; justify-content: space-around; align-items: center;}
                .box {background-color: rgb(22, 103, 130); padding: 20px; text-align: center;}

                .responsive-box {padding: 20px; text-align: center;}
                @media (max-width: 600px) {.responsive-box {background-color: rgb(3, 112, 30);}}
                @media (min-width: 601px) {.responsive-box {background-color: lightseagreen;}}

            </style>
        </head>
